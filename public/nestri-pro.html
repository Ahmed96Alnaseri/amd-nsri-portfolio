<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NESTRI PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ground:#0d0d0b;
  --ground-2:#111110;
  --card:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.09);
  --line-soft:rgba(255,255,255,.055);
  --line-copper:rgba(184,149,106,.28);
  --ink:#ece7dd;
  /* text is white (--ink) or copper; there is no grey text tier (same scale as NESTRI) */
  --copper:#b8956a;
  --copper-bright:#d8bb92;
  --copper-deep:#8c6b46;
  --good:#7fa06a;
  --crit:#d4705a;
  --fs-xs:11.5px;
  --fs-sm:13.5px;
  --fs-md:15.5px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"DM Serif Display",Georgia,serif;
}
*{box-sizing:border-box}
/* no visible scrollbars anywhere — every box still scrolls */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ground)}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--mono);
  font-size:var(--fs-md);line-height:1.5;font-variant-numeric:tabular-nums;
}
html[lang=ar] body{--mono:"IBM Plex Sans Arabic","IBM Plex Mono",Tahoma,sans-serif}
html[lang=ar] *{letter-spacing:0!important}
.wrap{max-width:1720px;margin:0 auto;padding-inline:clamp(16px,2.2vw,34px);padding-block:0 28px}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------------- file stamp + masthead ---------------- */
.filebar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:16px 12px;border-bottom:1px solid var(--line);
  font-size:var(--fs-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
}
.filebar b{color:var(--copper);font-weight:500}
.back{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);letter-spacing:.18em;text-transform:uppercase;color:var(--copper);text-decoration:none}
.back:focus-visible{outline:1px solid var(--copper);outline-offset:3px}
[dir=rtl] .back .arr{transform:scaleX(-1)}
.lang{display:flex;gap:2px;padding:2px;border:1px solid rgba(255,255,255,.09);border-radius:4px}
.lang button{height:24px;min-width:30px;padding:0 7px;border:0;border-radius:2px;background:transparent;color:var(--ink);font:500 var(--fs-xs) "IBM Plex Mono",monospace;letter-spacing:.04em;cursor:pointer}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed=true]{background:rgba(184,149,106,.14);color:var(--copper-bright);box-shadow:inset 0 0 0 1px rgba(184,149,106,.5)}
.lang button:focus-visible{outline:1px solid var(--copper);outline-offset:2px}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-block:22px 18px}
.eyebrow{margin:0 0 6px;font-size:var(--fs-xs);letter-spacing:.24em;text-transform:uppercase;color:var(--copper)}
.eyebrow::before{content:"— ";color:var(--copper-deep)}
.markrow{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
h1{
  font-family:var(--serif);font-weight:400;margin:0;direction:ltr;
  font-size:clamp(34px,4.2vw,46px);line-height:.95;letter-spacing:.01em;
}
h1 em{font-style:italic;color:var(--copper)}
.projbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.projbar .plabel{font-size:var(--fs-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.projbar input[type=text]{width:220px;border-bottom:1px solid var(--line)}

/* ---------------- run bar ---------------- */
.runbar{
  position:relative;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  border:1px solid var(--line);background:var(--card);padding:14px 16px;
}
.vrule{width:1px;height:34px;background:var(--line)}
/* compact toolbar so the controls stay on one line down to 1024px */
.runbar{gap:14px}
.runbar .field{min-width:0}
.runbar .field label{letter-spacing:.1em}
.runbar .field input[type=number]{width:90px}
/* only shows while a nest is solving or when Run cannot start; it never pushes the toolbar onto a second line */
.runstat{flex:1 1 0;min-width:0;text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--copper)}
.runstat.idle{color:var(--ink)}
.runstat.err{color:var(--crit)}
.runstat.warn{color:var(--copper-bright)}
.btn-primary.pending{box-shadow:0 0 0 1px var(--ground),0 0 0 3px rgba(184,149,106,.35)}
.prog{position:absolute;inset-inline:0;bottom:-1px;height:2px;background:transparent;pointer-events:none}
.prog i{display:block;height:100%;width:0;background:var(--copper);transition:width .2s linear}

/* ---------------- three-column body ---------------- */
.cols{
  display:grid;gap:16px;margin-top:16px;align-items:start;overflow:hidden;
  grid-template-columns:420px minmax(0,1.4fr) minmax(0,1fr);
  grid-template-rows:auto 1fr;
  grid-template-areas:"inputs report report" "inputs table view";
}
.cols>*{min-width:0}
.col-inputs{grid-area:inputs;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.col-report{grid-area:report}
.col-table{grid-area:table;display:flex;flex-direction:column}
.col-view{grid-area:view}

/* ---------------- cards ---------------- */
.card{position:relative;min-width:0;background:var(--card);border:1px solid var(--line);padding:14px 14px 12px}
.card::before,.card::after{content:"";position:absolute;width:9px;height:9px;pointer-events:none;border-color:var(--line-copper);border-style:solid}
.card::before{top:-1px;inset-inline-start:-1px;border-width:1px 0 0 1px}
.card::after{bottom:-1px;inset-inline-end:-1px;border-width:0 1px 1px 0}
[dir=rtl] .card::before{border-width:1px 1px 0 0}
[dir=rtl] .card::after{border-width:0 0 1px 1px}
.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:var(--fs-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.cardhead .num{color:var(--copper);direction:ltr}
.badge{margin-inline-start:auto;color:var(--copper);border:1px solid var(--line-copper);padding:2px 7px;letter-spacing:.14em;font-size:var(--fs-xs);white-space:nowrap}

/* ---------------- tables ---------------- */
.tscroll{overflow:auto}
.rows{max-height:300px}
.rows.short{max-height:230px}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
thead th{
  text-align:end;font-weight:400;color:var(--ink);font-size:var(--fs-xs);letter-spacing:.16em;
  text-transform:uppercase;padding:0 6px 7px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;z-index:1;background:#141310;
}
thead th:first-child{text-align:start}
tbody td{padding:3px 6px;border-bottom:1px solid var(--line-soft);text-align:end;white-space:nowrap}
tbody td:first-child{text-align:start}
tbody tr:last-child td{border-bottom:0}
/* skipped rows (qty 0, or a sheet not in play): struck through rather than greyed out */
tbody tr.row-off td{text-decoration:line-through;text-decoration-color:var(--copper)}
.idx{width:26px;color:var(--ink);font-size:var(--fs-xs)}
.col-lbl{min-width:76px}
.col-num{min-width:58px;width:16%}
.col-act{width:26px}
.col-inputs .idx{width:20px}
.col-inputs .col-lbl{min-width:70px}
.col-unl{width:76px;font-size:var(--fs-xs);letter-spacing:.04em}
.col-inputs .col-num{min-width:40px}
.col-inputs input[type=text],.col-inputs input[type=number]{font-size:var(--fs-sm)}
.col-inputs thead th{padding:0 4px 7px;letter-spacing:.04em}
.col-inputs tbody td{padding:3px 4px}
#partTable th.l,#partTable td.l,.rep th.l,.rep td.l{text-align:start}
.col-thumb{width:44px}
.col-size{width:96px}
.col-area{width:50px}
.col-qty{width:46px}
.thumb{display:block;width:36px;height:26px}
.thumb path{fill:rgba(184,149,106,.14);stroke:var(--copper);stroke-width:1;vector-effect:non-scaling-stroke}
.namecell{display:flex;align-items:center;min-width:90px}
.namecell input{min-width:0}
/* {02} has two more columns than NESTRI's sheet list (type, inventory ID): fixed column widths and tighter
   cells keep it inside the card, and Type takes whatever is left so a label like 1500×3000 shows in full */
.stable{table-layout:fixed}
.stable thead th,.stable tbody td{padding-inline:2px}
.stable th:nth-child(1){width:20px}
.stable th:nth-child(3){width:46px}
.stable th:nth-child(4){width:50px}
.stable th:nth-child(5){width:34px}
.stable th:nth-child(6){width:70px}
.stable th:nth-child(7){width:56px}
.stable th:nth-child(8){width:18px}
/* a ROLL / SHAPE / OFFCUT tag sits above its label rather than squeezing it */
.stable .namecell{min-width:0;flex-wrap:wrap;gap:2px 0}
.rtag{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--copper);border:1px solid var(--line-copper);padding:0 4px;margin-inline-end:5px;flex:none}
input[type=text],input[type=number],select{
  width:100%;background:transparent;border:0;border-bottom:1px solid transparent;color:var(--ink);
  font:inherit;font-size:var(--fs-sm);padding:2px 2px;text-align:end;border-radius:0;font-variant-numeric:tabular-nums;
}
input[type=text]{text-align:start}
input[type=number]{direction:ltr}
[dir=rtl] input[type=number]{text-align:left}
::placeholder{color:var(--copper);opacity:1}
/* the paste boxes' instructions are hints, not content: they stay a muted grey */
#pasteBox::placeholder,#sheetPasteBox::placeholder{color:#8a8278;opacity:1}
input[type=text]:hover,input[type=number]:hover,select:hover{border-bottom-color:var(--line)}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-bottom-color:var(--copper);background-color:rgba(184,149,106,.06)}
input[type=text]:disabled,input[type=number]:disabled{color:var(--ink)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* every picker is a bare underline with a copper chevron */
select{
  -webkit-appearance:none;appearance:none;text-align:start;cursor:pointer;border-bottom:1px solid var(--line);
  padding-inline-end:20px;
  background-image:linear-gradient(45deg,transparent 50%,var(--copper) 50%),linear-gradient(135deg,var(--copper) 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;
}
[dir=rtl] select{background-position:5px 55%,9px 55%}
select:hover{border-bottom-color:var(--line-copper)}
select option{background:#141310;color:var(--ink)}
.tgl{appearance:none;-webkit-appearance:none;width:26px;height:15px;border:1px solid var(--line);background:rgba(255,255,255,.05);position:relative;cursor:pointer;vertical-align:middle;padding:0;margin:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;background:var(--ink);transition:.14s}
.tgl:checked{border-color:var(--line-copper);background:rgba(184,149,106,.16)}
.tgl:checked::after{left:13px;background:var(--copper)}
.tgl:focus-visible{outline:1px solid var(--copper);outline-offset:2px}
.xbtn{background:none;border:0;color:var(--ink);cursor:pointer;font:inherit;font-size:13px;line-height:1;padding:2px 3px}
.xbtn:hover{color:var(--crit)}
.xbtn:focus-visible{outline:1px solid var(--copper)}

/* ---------------- buttons + fields ---------------- */
.btn{
  font:inherit;font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;background:transparent;
  color:var(--ink);border:1px solid var(--line);padding:7px 12px;cursor:pointer;transition:.15s;border-radius:0;
}
.btn:hover:not(:disabled){color:var(--copper-bright);border-color:var(--line-copper);background:rgba(184,149,106,.07)}
.btn:focus-visible{outline:1px solid var(--copper);outline-offset:2px}
/* disabled: white text kept, dashed border and a not-allowed cursor mark the state */
.btn:disabled{border-style:dashed;cursor:not-allowed}
.btn-primary{background:var(--copper);border-color:var(--copper);color:#14120f;font-weight:500;padding:11px 24px;letter-spacing:.2em}
.btn-primary:hover:not(:disabled){background:var(--copper-bright);border-color:var(--copper-bright);color:#14120f}
.btn-primary.busy{background:transparent;color:var(--copper-bright);border-color:var(--copper)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.field input[type=number],.field input[type=text]{border-bottom:1px solid var(--line);text-align:start;font-size:var(--fs-md)}
.field select{font-size:var(--fs-md)}
.col-inputs .field select{font-size:var(--fs-sm)}
.field #qtyCode{direction:ltr}
.tglwrap{display:flex;align-items:center;gap:8px;padding-top:4px}
.status{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);min-height:14px}
.status.ok{color:var(--good)}
.status.err{color:var(--crit)}
p.status{margin:8px 0 0;line-height:1.6}

/* ---------------- upload, files, layers ---------------- */
.drop{border:1px dashed var(--line);padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop.over{border-color:var(--copper);background:rgba(184,149,106,.06)}
.drop .hint{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);flex-basis:100%}
.files{margin-top:10px;border-top:1px solid var(--line)}
.file{padding:8px 0;border-bottom:1px solid var(--line-soft)}
.file .top{display:flex;align-items:center;gap:8px}
.file .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-sm);direction:ltr;text-align:start}
[dir=rtl] .file .fname{text-align:right}
.file .cnt{font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--copper);white-space:nowrap}
.file .opts{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.file .opts .field{flex:none;min-width:92px}
.file .opts .field input,.file .opts .field select{font-size:var(--fs-sm)}
.file .say{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--ink);margin:6px 0 0;line-height:1.55}
.file .say.warn{color:var(--copper-bright)}
.lay{display:grid;grid-template-columns:minmax(0,1fr) auto 150px;gap:4px 10px;align-items:center;margin-top:8px;font-size:var(--fs-sm)}
.lay .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
[dir=rtl] .lay .ln{text-align:right}
.lay .lc{color:var(--ink);font-size:var(--fs-xs)}
.lay .sw{display:inline-block;width:8px;height:8px;margin-inline-end:7px;border:1px solid rgba(255,255,255,.18)}
.lay select{font-size:var(--fs-sm)}
.inline{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.inline .field{flex:1 1 120px;min-width:0}

/* ---------------- paste blocks ---------------- */
details{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
summary{
  display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
  font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";color:var(--copper);margin-inline-end:2px}
details[open] summary::before{content:"–"}
summary:hover{color:var(--copper)}
summary:focus-visible{outline:1px solid var(--copper);outline-offset:3px}
.tag{margin-inline-start:auto;color:var(--copper);letter-spacing:.16em}
textarea{
  width:100%;margin-top:8px;min-height:74px;background:rgba(0,0,0,.28);border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:var(--fs-sm);padding:8px;resize:vertical;border-radius:0;
}
textarea:focus{outline:none;border-color:var(--line-copper)}

/* ---------------- report ---------------- */
.sechead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.sechead .num{color:var(--copper);font-size:var(--fs-sm);letter-spacing:.1em;direction:ltr}
.sechead .title{font-size:var(--fs-sm);letter-spacing:.24em;text-transform:uppercase}
.sechead .note2{margin-inline-start:auto;font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.sechead .note2.stale{color:var(--copper-bright)}
.sechead .note2.stale::after{content:" · " attr(data-stale)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.stat{padding:13px 15px;display:grid;gap:5px;align-content:start;border-inline-start:1px solid var(--line)}
/* the four cards share their rows, so a label that wraps onto two lines never pushes its figure below the others */
.stat{grid-row:span 3;grid-template-rows:subgrid}
.stat:first-child{border-inline-start:0}
.stat .k{font-size:var(--fs-xs);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.stat .v{font-family:var(--serif);font-size:34px;line-height:1;color:var(--ink);direction:ltr;text-align:start}
[dir=rtl] .stat .v{text-align:right}
.stat .v small{font-family:var(--mono);font-size:12px;color:var(--ink);margin-left:3px}
.stat .v.empty{font-size:20px;color:var(--ink)}
.stat.accent .v{color:var(--copper-bright)}
.stat .v.short{color:var(--crit)}
.stat .sub{font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.stat .sub.short{color:var(--crit)}
.meter{height:3px;background:rgba(255,255,255,.08);margin-top:2px}
.meter i{display:block;height:100%;background:var(--copper)}

.band{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);padding:12px 14px;margin-top:14px;font-size:var(--fs-sm);line-height:1.6}
.band .tagw{flex:none;font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);padding-top:2px}
.band.ok{border-color:rgba(127,160,106,.35);background:rgba(127,160,106,.06)}
.band.ok .tagw{color:var(--good)}
.band.short{border-color:rgba(212,112,90,.4);background:rgba(212,112,90,.07)}
.band.short .tagw{color:var(--crit)}
.band .txt{color:var(--ink)}
.band .txt b{color:var(--ink);font-weight:400}
.band .btn{flex:none;margin-inline-start:auto}
.shortlist{margin-top:10px;border:1px solid var(--line);padding:10px 12px;font-size:var(--fs-sm);color:var(--ink);display:grid;gap:5px}
.shortlist b{color:var(--ink);font-weight:400}
.shortlist i{font-style:normal;color:var(--crit)}

.subhead{display:flex;align-items:baseline;gap:12px;margin:16px 0 8px}
.subhead .title{font-size:var(--fs-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.subhead .note2{margin-inline-start:auto;font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.repbox{position:relative;border:1px solid var(--line);min-height:220px;max-height:440px;overflow:auto;max-width:100%;flex:1}
/* when the report box is tight, drop the mini bar and step the table text down a touch so all columns show */
.repbox{container-type:inline-size}
@container (max-width:640px){.repbox .rep{font-size:13px}.repbox .rep .bar{display:none}.repbox .rep thead th{letter-spacing:.04em;hyphens:auto;overflow-wrap:anywhere}.repbox .rep thead th,.repbox .rep tbody td,.repbox .rep tfoot td{padding-left:4px;padding-right:4px}}
.repbox::after{content:"";position:sticky;display:block;bottom:0;inset-inline-end:0;margin-inline-start:auto;width:9px;height:9px;border:solid var(--line-copper);border-width:0 1px 1px 0;pointer-events:none;margin-top:-9px}
/* header labels may wrap ("Part / m²") so the table fits its box at the larger type size */
.rep thead th{padding:9px 6px;background:#131210;letter-spacing:.08em;white-space:normal;vertical-align:bottom;line-height:1.3}
.rep tbody td{padding:7px 6px}
.rep tfoot td{padding:9px 6px;border-top:1px solid var(--line-copper);text-align:end;color:var(--copper-bright)}
.rep tfoot td:first-child{text-align:start;letter-spacing:.14em;text-transform:uppercase;font-size:var(--fs-xs)}
.bar{display:inline-block;width:34px;height:5px;background:rgba(255,255,255,.08);vertical-align:middle;margin-inline-start:8px}
.bar i{display:block;height:100%;background:var(--copper)}

/* ---------------- viewer ---------------- */
.viewer{border:1px solid var(--line);background:var(--ground-2);padding:12px}
.viewhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.viewhead b{color:var(--copper);font-weight:500}
.viewhead .u{color:var(--ink)}
.stage{height:clamp(240px,52vh,560px);display:flex;align-items:center;justify-content:center;direction:ltr}
.stage svg{display:block;width:100%;height:100%}
.stage .pt{cursor:pointer}
.stage .pt:hover,.stage .pt.sel{fill-opacity:1}
.ghost{width:100%;height:100%;border:1px dashed var(--line);display:grid;place-items:center;color:var(--ink);font-size:var(--fs-sm);letter-spacing:.2em;text-transform:uppercase}
.viewfoot{margin-top:9px;display:flex;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;font-size:var(--fs-xs);letter-spacing:.1em;color:var(--ink)}
.viewfoot span{white-space:nowrap}
.viewfoot .pick{flex-basis:100%;color:var(--copper-bright);unicode-bidi:plaintext;text-align:start;white-space:normal}
.viewfoot .pick:empty{display:none}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:3px 16px;margin-top:8px;font-size:var(--fs-sm);color:var(--ink);max-height:132px;overflow:auto}
.legend:empty{display:none}
/* long part names wrap instead of being cut off */
.legend span{overflow-wrap:anywhere}
.legend i{display:inline-block;width:8px;height:8px;margin-inline-end:7px}
.legend b{font-weight:400;color:var(--ink)}
.legend em{font-style:normal;color:var(--ink);margin-inline-start:6px}
.viewctl{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.viewctl .btn{padding:6px 11px}
.counter{font-size:var(--fs-xs);letter-spacing:.16em;color:var(--ink);min-width:52px;text-align:center;direction:ltr}
input[type=range]{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:3px;background:rgba(255,255,255,.14);border:0;padding:0;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible{outline:1px solid var(--copper);outline-offset:6px}
input[type=range]:disabled{opacity:.4;cursor:default}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;background:var(--copper);border:0;cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--copper);border:0;border-radius:0;cursor:pointer}
.offrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.offrow .field{width:150px}
.offrow .status{flex-basis:100%}
.offrow .status:empty{display:none}

/* ---------------- empty states ---------------- */
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:26px 16px;color:var(--ink);font-size:var(--fs-sm)}
.empty .h{font-size:var(--fs-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.empty .h::before{content:"— "}

footer{
  margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:var(--fs-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
}
footer b{color:var(--copper);font-weight:500}

/* ---------------- app shell: one screen, only the panels scroll ----------------
   Same as NESTRI: the page is exactly the viewport; header rows keep their height and the
   panel grid takes the rest. The inputs column, the report and the layout drawing scroll or
   scale inside their own boxes. Windows narrower than 1024px or shorter than 600px fall back
   to a normal scrolling page. */
@media (min-width:1024px) and (min-height:600px){
  html,body{height:100%;overflow:hidden}
  .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-block:0 10px}
  .filebar,.mast,.runbar,footer{flex:none}
  .filebar{padding-block:10px 8px}
  .mast{padding-block:12px 10px}
  footer{margin-top:10px;padding-top:8px}
  /* the drawing gets the full height of the right column; report and its table share the middle one */
  .cols{flex:1 1 auto;min-height:0;margin-top:12px;align-items:stretch;grid-template-rows:minmax(0,auto) minmax(260px,1fr);
        grid-template-columns:420px minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"inputs report view" "inputs table view"}
  .col-inputs{min-height:0;overflow-y:auto}
  /* the report keeps the table row at least 260px tall and scrolls inside itself if it cannot fit */
  .col-report{min-height:0;overflow-y:auto}
  .stat{padding:10px 12px}
  .stat .v{font-size:28px}
  .band{margin-top:10px;padding:10px 12px}
  .subhead{margin:10px 0 6px}
  .col-table{min-height:0}
  .col-table .repbox{min-height:0;max-height:none}
  .col-view{min-height:0;display:flex;flex-direction:column}
  .col-view .viewer{flex:1;min-height:0;display:flex;flex-direction:column}
  /* the drawing scales to whatever height is left (the script's tall-sheet height is overridden) */
  .col-view .stage{flex:1;min-height:0;height:auto!important}
  /* the per-sheet list keeps to three rows and scrolls, so the drawing keeps most of the column */
  .legend{max-height:66px}
}
@media (min-width:1024px) and (max-width:1240px) and (min-height:600px){
  html .cols{grid-template-columns:410px minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"inputs report view" "inputs table view"}
  /* PRO has one more toolbar control than NESTRI (Mirror): a tighter bar keeps it on one line */
  .runbar{gap:12px}
  .runbar .vrule-mat{display:none}
  /* "NESTRI PRO" is a wider title than "NESTRI": a shorter project field keeps the masthead on one line */
  .projbar input[type=text]{width:200px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-inline-start:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}

/* ---------------- narrow ---------------- */
@media(max-width:1240px){
  .cols{grid-template-columns:410px minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"inputs report" "inputs view" "inputs table"}
}
@media(max-width:900px){
  .wrap{display:flex;flex-direction:column}
  .filebar{order:1}.mast{order:2}.cols{order:3}.runbar{order:4;margin-top:14px}footer{order:5}
  .cols{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"report" "view" "table" "inputs"}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-inline-start:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .projbar input[type=text]{width:150px}
  .stage{height:clamp(220px,46vh,430px)}
  .runbar .vrule{display:none}
  .runstat{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="filebar">
    <a class="back" href="https://amd-nsri-portfolio-alpha.vercel.app" target="_self"><span class="arr">←</span> AMD NSRI</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="tr">TR</button>
      <button type="button" data-lang="ar">AR</button>
    </div>
  </div>

  <header class="mast">
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <div class="markrow">
        <h1>NEST<em>RI</em> PRO</h1>
      </div>
    </div>
    <div class="projbar">
      <span class="plabel" data-i18n="project"></span>
      <input type="text" id="projName" maxlength="60" data-i18n-ph="untitled">
      <button class="btn" id="projSave" type="button" data-i18n="save"></button>
      <button class="btn" id="projExport" type="button" data-i18n="export"></button>
      <button class="btn" id="projImport" type="button" data-i18n="import"></button>
      <input type="file" id="projFile" accept=".json,application/json" hidden>
      <span class="status" id="projStatus"></span>
    </div>
  </header>

  <div class="runbar">
    <button class="btn btn-primary" id="run" type="button" data-i18n="run"></button>
    <button class="btn" id="resetAll" type="button" data-i18n="reset"></button>
    <span class="vrule"></span>
    <div class="field">
      <label for="gap" data-i18n="gap"></label>
      <input type="number" id="gap" value="5" min="0" step="0.5">
    </div>
    <div class="field">
      <label for="trim" data-i18n="trim"></label>
      <input type="number" id="trim" value="10" min="0" step="1">
    </div>
    <div class="field">
      <label for="rot" data-i18n="rotate" data-i18n-title="rotTip"></label>
      <span class="tglwrap"><input type="checkbox" class="tgl" id="rot" checked></span>
    </div>
    <div class="field">
      <label for="mir" data-i18n="cMirror" data-i18n-title="mirrorTip"></label>
      <span class="tglwrap"><input type="checkbox" class="tgl" id="mir"></span>
    </div>
    <span class="vrule vrule-mat"></span>
    <div class="field">
      <label for="material" data-i18n="material"></label>
      <select id="material"></select>
    </div>
    <div class="field">
      <label for="thickness" data-i18n="thickness"></label>
      <input type="number" id="thickness" value="2" min="0" step="0.1">
    </div>
    <span class="runstat idle" id="runHint"></span>
    <div class="prog"><i id="progBar"></i></div>
  </div>

  <div class="cols">

    <!-- ============ inputs ============ -->
    <aside class="col-inputs">

      <section class="card">
        <div class="cardhead"><span class="num">{01}</span> <span data-i18n="parts"></span> <span class="badge" id="partCount"></span></div>

        <div class="drop" id="drop">
          <button class="btn" id="upBtn" type="button" data-i18n="upload"></button>
          <button class="btn" id="sampleBtn" type="button" data-i18n="sample"></button>
          <button class="btn" id="clearParts" type="button" data-i18n="clear"></button>
          <input type="file" id="upFile" accept=".dxf,.dwg" multiple hidden>
          <span class="hint" data-i18n="dropHint"></span>
        </div>
        <p class="status" id="upStatus"></p>
        <div class="inline">
          <div class="field">
            <label for="qtyCode" data-i18n="qtyCode"></label>
            <input type="text" id="qtyCode" value="a:" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="minPart" data-i18n="minPart"></label>
            <input type="number" id="minPart" value="20" min="0" step="1">
          </div>
        </div>

        <div class="files" id="files" hidden></div>

        <details id="layerBox" hidden>
          <summary><span data-i18n="layers"></span> <span class="tag" id="layerTag"></span></summary>
          <div class="lay" id="layerList"></div>
        </details>

        <div class="tscroll rows" style="margin-top:10px">
          <table id="partTable">
            <thead>
              <tr>
                <th class="idx">#</th>
                <th class="col-thumb"></th>
                <th class="l" data-i18n="cName"></th>
                <th class="col-size" data-i18n="cSize"></th>
                <th class="col-area">m²</th>
                <th class="col-qty" data-i18n="cQty"></th>
                <th class="col-act"></th>
              </tr>
            </thead>
            <tbody id="partBody"></tbody>
          </table>
          <div class="empty" id="partsEmpty">
            <span class="h" data-i18n="noParts"></span>
          </div>
        </div>

        <details open>
          <summary data-i18n="pasteQty"></summary>
          <textarea id="pasteBox" data-i18n-ph="pastePh"></textarea>
          <div class="btn-row">
            <button class="btn" id="pasteReplace" type="button" data-i18n="replaceRows"></button>
            <button class="btn" id="pasteAdd" type="button" data-i18n="addToList"></button>
            <span class="status" id="pasteStatus"></span>
          </div>
        </details>
      </section>

      <section class="card">
        <div class="cardhead"><span class="num">{02}</span> <span data-i18n="sheets"></span> <span class="badge" id="sheetCount"></span></div>
        <div class="tscroll rows short">
          <table class="stable">
            <thead>
              <tr>
                <th class="idx">#</th>
                <th class="col-lbl" data-i18n="cType"></th>
                <th class="col-num" data-i18n="cWidth"></th>
                <th class="col-num" data-i18n="cLength"></th>
                <th class="col-num" data-i18n="cQty"></th>
                <th class="col-unl" data-i18n="cUnl"></th>
                <th class="col-num" data-i18n="cInv"></th>
                <th class="col-act"></th>
              </tr>
            </thead>
            <tbody id="sheetBody"></tbody>
          </table>
        </div>
        <div class="btn-row">
          <button class="btn" id="addSheet" type="button" data-i18n="addSheet"></button>
          <button class="btn" id="allUnlimited" type="button" data-i18n="allUnl"></button>
        </div>
        <p class="status" data-i18n="skip0"></p>
        <div class="offrow">
          <div class="field">
            <label for="minOff" data-i18n="minOff"></label>
            <input type="number" id="minOff" value="300" min="50" step="10">
          </div>
          <button class="btn" id="keepOff" type="button" data-i18n="keepOff"></button>
          <span class="status" id="offStatus"></span>
        </div>

        <details open>
          <summary data-i18n="pasteExcel"></summary>
          <textarea id="sheetPasteBox" data-i18n-ph="sheetPh"></textarea>
          <div class="btn-row">
            <button class="btn" id="sheetPasteReplace" type="button" data-i18n="replaceRows"></button>
            <button class="btn" id="sheetPasteAdd" type="button" data-i18n="addToList"></button>
            <span class="status" id="sheetPasteStatus"></span>
          </div>
        </details>

        <details>
          <summary data-i18n="special"></summary>
          <div class="inline">
            <div class="field">
              <label for="rollW" data-i18n="rollW"></label>
              <select id="rollW"><option>1000</option><option>1200</option><option selected>1250</option><option>1500</option><option>2000</option></select>
            </div>
            <div class="field">
              <label for="rollL" data-i18n="rollL"></label>
              <input type="number" id="rollL" value="6000" min="0" step="1">
            </div>
            <div class="field">
              <label for="rollAllow" data-i18n="allowance"></label>
              <input type="number" id="rollAllow" value="20" min="0" step="1">
            </div>
            <button class="btn" id="addRoll" type="button" data-i18n="addRoll"></button>
          </div>
          <div class="btn-row">
            <button class="btn" id="sheetDxfBtn" type="button" data-i18n="sheetDxf"></button>
            <input type="file" id="sheetDxfFile" accept=".dxf,.dwg" hidden>
            <span class="status" id="sheetDxfStatus"></span>
          </div>
        </details>
      </section>

    </aside>

    <!-- ============ report ============ -->
    <section class="col-report" id="reportTop">
      <div class="sechead">
        <span class="num">{03}</span><span class="title" data-i18n="report"></span>
        <span class="note2" id="reportNote"></span>
      </div>

      <div class="stats">
        <div class="stat accent">
          <span class="k" data-i18n="sSheets"></span>
          <span class="v empty" id="sSheets">—</span>
          <span class="sub" id="sSheetsSub"></span>
        </div>
        <div class="stat">
          <span class="k" data-i18n="sEff"></span>
          <span class="v empty" id="sEff">—</span>
          <div class="meter"><i id="sEffBar" style="width:0%"></i></div>
        </div>
        <div class="stat">
          <span class="k" data-i18n="sWaste"></span>
          <span class="v empty" id="sWaste">—</span>
          <span class="sub" id="sWasteSub"></span>
        </div>
        <div class="stat">
          <span class="k" data-i18n="sPlaced"></span>
          <span class="v empty" id="sPlaced">—</span>
          <span class="sub" id="sPlacedSub"></span>
        </div>
      </div>

      <div class="band" id="band" hidden>
        <span class="tagw" id="bandTag"></span>
        <span class="txt" id="bandText"></span>
        <button class="btn" id="bandBtn" type="button" hidden></button>
      </div>
      <div class="shortlist" id="shortList" hidden></div>
    </section>

    <!-- ============ tables ============ -->
    <section class="col-table">
      <div class="subhead">
        <span class="title" data-i18n="perSize"></span>
        <span class="note2" id="sizesNote"></span>
      </div>
      <div class="repbox">
        <table class="rep">
          <thead>
            <tr>
              <th data-i18n="hSize"></th><th data-i18n="hUsed"></th><th data-i18n="hParts"></th>
              <th data-i18n="hPartArea"></th><th data-i18n="hEff"></th><th data-i18n="hWeight"></th>
            </tr>
          </thead>
          <tbody id="sizeBody"></tbody>
          <tfoot id="sizeFoot"></tfoot>
        </table>
        <div class="empty" id="sizeEmpty">
          <span class="h" data-i18n="nothing"></span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="expXlsx" type="button" data-i18n="xXlsx"></button>
        <button class="btn" id="expDxf" type="button" data-i18n="xDxf"></button>
        <span class="status" id="expStatus"></span>
      </div>
    </section>

    <!-- ============ layout ============ -->
    <section class="col-view">
      <div class="sechead">
        <span class="num">{04}</span><span class="title" data-i18n="layout"></span>
        <span class="note2" id="layoutNote"></span>
      </div>
      <div class="viewer">
        <div class="viewhead">
          <span><b><span data-i18n="sheet"></span> <span id="vIndex">—</span></b> / <span id="vCount">—</span></span>
          <span class="u" id="vUtil"></span>
        </div>
        <div class="stage" id="vStage"></div>
        <div class="viewfoot">
          <span id="vInfo"></span>
          <span id="vOffcuts"></span>
          <span class="pick" id="vPick"></span>
        </div>
        <details class="legend-box" id="vLegendBox" hidden>
          <summary><span data-i18n="onSheet"></span> <span class="tag" id="vLegendTag"></span></summary>
          <div class="legend" id="vLegend"></div>
        </details>
        <div class="viewctl">
          <button class="btn" id="vPrev" type="button" disabled data-i18n="prev"></button>
          <input type="range" id="vSlider" min="1" max="1" value="1" disabled aria-label="Sheet number">
          <span class="counter" id="vCounter">— / —</span>
          <button class="btn" id="vNext" type="button" disabled data-i18n="next"></button>
        </div>
      </div>
    </section>

  </div>

  <footer>
    <span>AMD·NSRI — <b>NESTRI PRO</b></span>
  </footer>
</div>
<script>

function decode(buf) {

  try { return { text: new TextDecoder(enc, { fatal: enc === 'utf-8' }).decode(bytes) }; }
  catch (e) {
    try { return { text: new TextDecoder(cp ? 'windows-' + cp[1] : 'windows-1254').decode(bytes) }; }
    catch (e2) { return { text: new TextDecoder('utf-8').decode(bytes) }; }

function readFile(file, done) {

    try { done(null, NP.readDxf(d.text)); }
    catch (e) { done(e.code === 'binary' ? 'errBinary' : e.code === 'dwg' ? 'errDwg' : 'errNotDxf'); }
  };
  fr.onerror = function () { done('errNotDxf'); };

/* one mapping row per layer, or per layer + colour where entities carry their own colour */
function fileKeys(f) {
  var keys = {};
  f.items.forEach(function (it) {
    var key = NP.keyOf(it), k = keys[key] || (keys[key] = { n: 0, text: 0, layer: it.l, col: it.q || (f.lc && f.lc[it.l]) || 7 });
    k.n++;

}
function tryRoles(f, roles) {
  try {
    var r = NP.buildParts(f.items, { scale: NP.UNIT_SCALE[f.unit] || 1, join: f.join, fileName: 'x', fileId: 'x', minPart: num('minPart'),
      role: function (it) { return roles[NP.keyOf(it)] || 'outer'; } });

function guessKeys(f) {
  var keys = fileKeys(f), names = Object.keys(keys), fresh = names.filter(function (k) { return !S.roles[k]; });
  if (!fresh.length) return;
  var base = {}, cutOther = 0;
  names.forEach(function (key) {
    var k = keys[key];
    base[key] = S.roles[key] || (k.text === k.n ? 'text' : NP.guessRole(k.layer));
  });
  names.forEach(function (key) { if (base[key] === 'outer' && keys[key].col !== 1) cutOther++; });
  var redBend = {}, allCut = {};
  names.forEach(function (key) {
    var k = keys[key], isFresh = !S.roles[key];
    redBend[key] = isFresh && base[key] === 'outer' && k.col === 1 && cutOther ? 'bend' : base[key];
    allCut[key] = isFresh && k.text !== k.n && !/defpoints/i.test(k.layer) ? 'outer' : base[key];
  });

function labelQty(name) {

function rebuild() {

    res.parts.forEach(function (p) {

    var tk = line.trim().split(/[\t,;]+|\s+/).filter(function (s) { return s !== ''; });

    rows.push([tk.slice(0, -1).join(' ').toLowerCase(), Math.max(0, Math.round(parseFloat(q)))]);
  });

  if (!rows.length) return setHint('hintNoStock', 'err');
  var rv = $('rot').checked ? 'auto' : 'none', mat = MATERIALS.filter(function (m) { return m[0] === $('material').value; })[0] || MATERIALS[0];
  var job = {
    types: types, gap: Math.max(0, num('gap')), trim: Math.max(0, num('trim')),
    rot: rv === 'none' ? 'none' : 90, allowance: Math.max(0, num('rollAllow')),
    stock: rows.map(function (r) { return { w: r.w, l: r.l, qty: r.qty, unlimited: r.unl, roll: r.roll, outline: r.shape ? r.shape.rings : null }; })

  solving = true; cancelFlag = false;

        $('progBar').style.width = Math.min(100, 100 * ((pn - 1) + (g.total ? Math.min(done, g.total) / g.total : 0)) / ps) + '%';
      }

  }

  btn.textContent = t('run'); btn.classList.remove('busy');
  $('progBar').style.width = '0%';
  if (!res) return setHint('stopped', 'err');
  last = {
    res: res, parts: map, qty: types.map(function (x) { return x.qty; }),
    rows: rows.map(function (r) { return { label: r.label, w: r.w, l: r.l, inv: r.inv, roll: r.roll, shape: r.shape }; }),
    gap: job.gap, trim: job.trim, rot: rv, mir: mir, mat: mat, thk: Math.max(0, num('thickness')),
    name: $('projName').value.trim(), date: new Date(), kept: false, sum: null

  if (window.matchMedia && window.matchMedia('(max-width:900px)').matches) {

}

/* -------------------------------- report -------------------------------- */
function sheetArea(L, sh) { var r = L.rows[sh.stock]; return r.shape ? r.shape.area : sh.w * sh.l; }
function kg(L, areaMm2) { return m2(areaMm2) * L.thk * L.mat[1]; }
function ranges(a) {
  var o = [], i = 0;
  while (i < a.length) {
    var j = i;
    while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    o.push(j > i ? a[i] + '–' + a[j] : String(a[i]));
    i = j + 1;
  }
  return o.join(', ');
}

function summarize(L) {
  if (L.sum) return L.sum;
  var s = { sheets: L.res.sheets.length, ordered: 0, placed: 0, net: 0, area: 0, groups: [], per: [] }, gmap = {};
  L.qty.forEach(function (q) { s.ordered += q; });
  var cnt = L.parts.map(function () { return 0; }), on = L.parts.map(function () { return []; });
  L.res.sheets.forEach(function (sh, i) {
    var a = sheetArea(L, sh), key = sh.stock + (sh.roll ? ':' + sh.l : ''), g = gmap[key];
    if (!g) { g = gmap[key] = { w: sh.w, l: sh.l, row: L.rows[sh.stock], n: 0, parts: 0, net: 0, area: 0 }; s.groups.push(g); }
    g.n++; g.parts += sh.cnt; g.net += sh.net; g.area += a;
    s.placed += sh.cnt; s.net += sh.net; s.area += a;
    var seen = {};
    sh.pl.forEach(function (pl) { cnt[pl.t]++; if (!seen[pl.t]) { seen[pl.t] = 1; on[pl.t].push(i + 1); } });
  });
  L.parts.forEach(function (p, i) { s.per.push({ p: p, req: L.qty[i], placed: cnt[i], on: ranges(on[i]) }); });
  L.sum = s;
  return s;
}

function renderBand() {
  var band = $('band'), btn = $('bandBtn'), list = $('shortList');
  band.className = 'band'; btn.hidden = true; list.hidden = true;
  // nothing to say before a nest has run, so the band stays out of the way
  band.hidden = !last;
  if (!last) return;
  var res = last.res, s = summarize(last);
  if (res.partial) {
    band.className = 'band short'; $('bandTag').textContent = t('bStop'); $('bandText').textContent = t('bStopTxt');
  } else if (!res.unplaced.length) {
    band.className = 'band ok'; $('bandTag').textContent = t('bOk'); $('bandText').innerHTML = t('bOkTxt', s.placed, s.sheets);
  } else {
    var miss = 0;
    res.unplaced.forEach(function (u) { miss += u.qty; });
    band.className = 'band short'; $('bandTag').textContent = t('bShort');
    $('bandText').innerHTML = t('bShortTxt', miss, res.unplaced.length);
    btn.hidden = false; btn.textContent = t('showThem'); btn.dataset.act = 'short';
    list.innerHTML = res.unplaced.map(function (u) {
      var p = last.parts[u.t];
      return '<span><b>' + esc(p.name) + '</b> <span class="ltr">' + fmt(p.w) + ' × ' + fmt(p.h) + ' mm · ×' + u.qty + '</span> — <i>' +
             esc(t(u.reason === 'big' ? 'whyBig' : 'whyStock')) + '</i></span>';

}

  $('sizeEmpty').hidden = s.sheets > 0;

/* --------------------------------- layout -------------------------------- */
function svgText(x, y, fs, fill, str, extra) {
  return '<text x="' + r1(x) + '" y="' + r1(y) + '" fill="' + fill + '" font-family="IBM Plex Mono, monospace" font-size="' +
         r1(fs) + '" text-anchor="middle" dominant-baseline="central" pointer-events="none"' + (extra || '') + '>' + esc(str) + '</text>';
}
function offcutsOf(sh) {
  var m = Math.max(50, num('minOff'));
  return sh.left.filter(function (r) { return Math.min(r.w, r.h) >= m; });
}

function sheetSvg(L, idx, light) {
  var C = light ? { sheet: '#ffffff', line: '#444444', trimO: '.9', off: '#efece5', offLine: '#999999', offTxt: '#777777', part: '#222222', dim: '#333333' }
                : { sheet: '#15140f', line: '#6f675a', trimO: '.3', off: '#221e18', offLine: '#4e483e', offTxt: '#ece7dd', part: '#0d0d0b', dim: '#ece7dd' };
  var sh = L.res.sheets[idx], row = L.rows[sh.stock], W = sh.w, H = sh.l, maxDim = Math.max(W, H);
  var padL = maxDim * 0.085, padB = maxDim * 0.085, padT = maxDim * 0.025, padR = maxDim * 0.025;
  var sw = maxDim * 0.0016, tick = maxDim * 0.012, defs = '', used = {}, geo = '', txt = '';
  sh.pl.forEach(function (pl) {
    if (used[pl.t]) return;
    used[pl.t] = 1;
    var p = L.parts[pl.t];
    defs += '<g id="pt' + pl.t + '"><path fill-rule="evenodd" d="' + p.d + '"/>' +
      (p.markD ? '<path d="' + p.markD + '" fill="none" stroke="#14120f" stroke-opacity=".3" stroke-width="' + r1(sw * 0.6) + '"/>' : '') +
      (p.bendD ? '<path d="' + p.bendD + '" fill="none" stroke="#14120f" stroke-opacity=".55" stroke-width="' + r1(sw * 0.7) +
      '" stroke-dasharray="' + r1(maxDim * 0.006) + ' ' + r1(maxDim * 0.004) + '"/>' : '') + '</g>';
  });
  if (row.shape) {
    geo += '<path fill-rule="evenodd" d="' + pathD(row.shape.rings) + '" fill="' + C.sheet + '" stroke="' + C.line + '" stroke-width="' + sw + '"/>';
  } else {
    geo += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="' + C.sheet + '" stroke="' + C.line + '" stroke-width="' + sw + '"/>';
    if (L.trim > 0) {
      geo += '<rect x="' + L.trim + '" y="' + L.trim + '" width="' + (W - 2 * L.trim) + '" height="' + (H - 2 * L.trim) +
        '" fill="none" stroke="#b8956a" stroke-opacity="' + C.trimO + '" stroke-width="' + (sw * 0.8) + '" stroke-dasharray="' +
        (maxDim * 0.012) + ' ' + (maxDim * 0.008) + '"/>';
    }
  }
  offcutsOf(sh).forEach(function (r) {
    geo += '<rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" fill="' + C.off + '" fill-opacity=".8" stroke="' + C.offLine + '" stroke-width="' +
      (sw * 0.7) + '" stroke-dasharray="' + (maxDim * 0.008) + ' ' + (maxDim * 0.006) + '"/>';
    var lab = Math.round(r.w) + ' × ' + Math.round(r.h), fs = Math.min(Math.min(r.w, r.h) * 0.3, maxDim * 0.022);
    var cx = r.x + r.w / 2, cy = H - (r.y + r.h / 2);
    if (r.w > lab.length * fs * 0.62) txt += svgText(cx, cy, fs, C.offTxt, lab);
    else if (r.h > lab.length * fs * 0.62) txt += svgText(cx, cy, fs, C.offTxt, lab, ' transform="rotate(-90 ' + r1(cx) + ' ' + r1(cy) + ')"');
  });
  sh.pl.forEach(function (pl, k) {
    var p = L.parts[pl.t], col = PALETTE[pl.t % PALETTE.length];
    geo += '<use href="#pt' + pl.t + '" class="pt" data-k="' + k + '" transform="translate(' + r1(pl.x) + ' ' + r1(pl.y) + ') rotate(' + pl.a + ')' +
      (pl.m ? ' scale(-1 1)' : '') + '" fill="' + col + '" fill-opacity=".85" stroke="' + C.part + '" stroke-width="' + r1(sw * 0.8) + '"/>';
    var r = p.label.r, nm = p.name || '', n = Math.max(nm.length, 1);
    var fs = Math.min(maxDim * 0.024, r * 0.62, 2 * r * 0.92 / n / 0.62);
    if (fs < maxDim * 0.0042) return;
    var c = NP.xform(p.label.x, p.label.y, pl.a, pl.m), cx = c[0] + pl.x, cy = H - (c[1] + pl.y), ra = NP.readableAngle(pl.a);
    var two = r > fs * 1.5, inner = svgText(0, two ? -fs * 0.55 : 0, fs, '#14120f', nm);
    if (two) inner += svgText(0, fs * 0.7, fs * 0.78, '#2a2319', t('pcsOn', L.qty[pl.t]));
    if (p.grain) {
      var gx = -(n * fs * 0.31 + fs * 0.9), gl = fs * 0.95, hw = fs * 0.28;
      inner += '<path d="M' + r1(gx) + ' ' + r1(-gl) + 'V' + r1(gl) + 'M' + r1(gx - hw) + ' ' + r1(-gl + hw) + 'L' + r1(gx) + ' ' + r1(-gl) + 'L' + r1(gx + hw) + ' ' + r1(-gl + hw) +
        'M' + r1(gx - hw) + ' ' + r1(gl - hw) + 'L' + r1(gx) + ' ' + r1(gl) + 'L' + r1(gx + hw) + ' ' + r1(gl - hw) +
        '" fill="none" stroke="#14120f" stroke-width="' + r1(fs * 0.1) + '" pointer-events="none"/>';
    }
    txt += '<g transform="translate(' + r1(cx) + ' ' + r1(cy) + ')' + (ra ? ' rotate(' + (-ra) + ')' : '') + '">' + inner + '</g>';
  });
  var o = '<svg viewBox="' + [-padL, -padT, W + padL + padR, H + padT + padB].join(' ') + '" role="img" aria-label="' +
          esc(t('sheet')) + ' ' + (idx + 1) + '"><defs>' + defs + '</defs><g transform="matrix(1 0 0 -1 0 ' + H + ')">' + geo + '</g>' + txt;
  var dimFs = maxDim * 0.026, yb = H + padB * 0.55, xl = -padL * 0.55, xt = xl - dimFs * 1.15;
  var dimV = function (v) { return fmt(v, light && v % 1 ? 1 : 0); };
  o += '<path d="M0 ' + yb + ' H' + W + ' M0 ' + (yb - tick) + ' V' + (yb + tick) + ' M' + W + ' ' + (yb - tick) + ' V' + (yb + tick) +
       ' M' + xl + ' 0 V' + H + ' M' + (xl - tick) + ' 0 H' + (xl + tick) + ' M' + (xl - tick) + ' ' + H + ' H' + (xl + tick) +
       '" stroke="' + C.line + '" stroke-width="' + sw + '" fill="none"/>';
  o += svgText(W / 2, yb + dimFs * 1.15, dimFs, C.dim, dimV(W) + ' mm');
  o += svgText(xt, H / 2, dimFs, C.dim, dimV(H) + ' mm' + (row.inv ? '  (' + t('invId', row.inv) + ')' : ''),
               ' transform="rotate(-90 ' + r1(xt) + ' ' + r1(H / 2) + ')"');
  return o + '</svg>';
}

/* one nested sheet as a PNG, for the Excel report */
function rasterSheet(L, idx) {
  return new Promise(function (ok) {
    var sh = L.res.sheets[idx], md = Math.max(sh.w, sh.l), vw = sh.w + md * 0.11, vh = sh.l + md * 0.11;
    var H = 380, W = Math.round(H * vw / vh);
    if (W > 560) { W = 560; H = Math.round(W * vh / vw); }
    var svg = sheetSvg(L, idx, true).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="' + (W * 2) + '" height="' + (H * 2) + '" ');
    var img = new Image();
    img.onload = function () {
      try {
        var cv = document.createElement('canvas');
        cv.width = W * 2; cv.height = H * 2;
        var g = cv.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
        g.drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function (bl) {
          if (!bl) return ok(null);
          bl.arrayBuffer().then(function (ab) { ok({ data: new Uint8Array(ab), w: W, h: H }); }, function () { ok(null); });
        }, 'image/png');
      } catch (e) { ok(null); }
    };
    img.onerror = function () { ok(null); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function keepOffcuts() {

  var agg = {}, order = [], n = 0;
  last.res.sheets.forEach(function (sh) {
    if (sh.roll) return;
    offcutsOf(sh).forEach(function (r) {
      var w = Math.min(r.w, r.h), l = Math.max(r.w, r.h), key = w + 'x' + l;
      if (!agg[key]) { agg[key] = { w: w, l: l, qty: 0 }; order.push(key); }
      agg[key].qty++; n++;
    });
  });
  if (!n) return setStatus('offStatus', 'err', 'noOff');
  order.forEach(function (k) { addStock({ label: agg[k].w + '×' + agg[k].l, w: agg[k].w, l: agg[k].l, qty: agg[k].qty, off: true }); });
  last.kept = true;
  $('keepOff').disabled = true;

  setStatus('offStatus', 'ok', 'kept', n);
}

  var el = e.target, tr = el.closest('tr'), r = tr && S.stock[+tr.getAttribute('data-i')], k = el.getAttribute('data-k');
  if (!r || !k || k === 'unl' || k === 'x') return;
  if (k === 'label' || k === 'inv') r[k] = el.value;
  else r[k] = k === 'qty' ? Math.max(0, Math.floor(+el.value || 0)) : Math.max(0, +el.value || 0);
  tr.classList.toggle('row-off', !stockOn(r));
  updateSheetCount(); touch();
});
$('sheetBody').addEventListener('change', function (e) {
  var el = e.target, tr = el.closest('tr'), r = tr && S.stock[+tr.getAttribute('data-i')];
  if (!r || el.getAttribute('data-k') !== 'unl') return;
  r.unl = el.checked;
  tr.querySelector('[data-k=qty]').disabled = r.unl;
  tr.classList.toggle('row-off', !stockOn(r));
  updateSheetCount(); touch();
});
$('sheetBody').addEventListener('click', function (e) {
  if (e.target.getAttribute('data-k') !== 'x') return;
  S.stock.splice(+e.target.closest('tr').getAttribute('data-i'), 1);
  renderStock(); touch();
});
$('sheetBody').addEventListener('focusin', function (e) { if (e.target.type === 'number') e.target.select(); });
$('addSheet').addEventListener('click', function () { addStock({ label: '', w: 0, l: 0, qty: 0, unl: true }); renderStock(); touch(); });
$('allUnlimited').addEventListener('click', function () { S.stock.forEach(function (r) { if (!r.shape && !r.off) r.unl = true; }); renderStock(); touch(); });
$('sheetPasteReplace').addEventListener('click', function () { applySheetPaste('replace'); });
$('sheetPasteAdd').addEventListener('click', function () { applySheetPaste('add'); });
$('addRoll').addEventListener('click', function () {
  var w = +$('rollW').value, l = Math.max(0, num('rollL'));
  if (!(l > 0)) return;
  addStock({ label: w + '×' + l, w: w, l: l, qty: 1, unl: false, roll: true });
  renderStock(); touch();
});
$('sheetDxfBtn').addEventListener('click', function () { $('sheetDxfFile').click(); });
$('sheetDxfFile').addEventListener('change', function () { var f = this.files && this.files[0]; this.value = ''; if (f) addSheetOutline(f); });

$('run').addEventListener('click', run);
$('resetAll').addEventListener('click', resetAll);
['gap', 'trim', 'thickness', 'rollAllow'].forEach(function (id) { $(id).addEventListener('input', touch); });
['rot', 'mir', 'material'].forEach(function (id) { $(id).addEventListener('change', touch); });
$('projName').addEventListener('input', function () { if (!last) renderReport(); });
$('bandBtn').addEventListener('click', function () {
  var list = $('shortList');
  list.hidden = !list.hidden;
  this.textContent = t(list.hidden ? 'showThem' : 'hide');
});

$('vPrev').addEventListener('click', function () { showSheet(viewIdx - 1); });
$('vNext').addEventListener('click', function () { showSheet(viewIdx + 1); });
$('vSlider').addEventListener('input', function () { showSheet((+this.value || 1) - 1); });
document.addEventListener('keydown', function (e) {
  var tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'SUMMARY') return;
  if (e.key === 'ArrowLeft') showSheet(viewIdx - 1); else if (e.key === 'ArrowRight') showSheet(viewIdx + 1);
});
$('vStage').addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('.pt') : null;
  if (!el || !last) return;
  var old = $('vStage').querySelector('.pt.sel');
  if (old) old.classList.remove('sel');
  el.classList.add('sel');
  var pl = last.res.sheets[viewIdx].pl[+el.getAttribute('data-k')], p = last.parts[pl.t];
  $('vPick').textContent = t('pick', p.name, fmt(pl.x), fmt(pl.y), fmt(pl.a, pl.a % 1 ? 2 : 0)) + (pl.m ? ' · ' + t('mirrored') : '');
});
$('minOff').addEventListener('input', function () { if (last) showSheet(viewIdx); });
$('keepOff').addEventListener('click', keepOffcuts);
$('expXlsx').addEventListener('click', exportXlsx);
$('expDxf').addEventListener('click', exportDxf);

$('projSave').addEventListener('click', saveProject);
$('projExport').addEventListener('click', function () {
  var d = projectData();
  deliver('projStatus', 'nestri-pro-' + (slug(d.name) || 'project') + '.json', JSON.stringify(d), 'application/json');
});
$('projImport').addEventListener('click', function () { $('projFile').click(); });
$('projFile').addEventListener('change', function () { var f = this.files && this.files[0]; this.value = ''; if (f) importProject(f); });
var lb = document.querySelectorAll('.lang button');
for (var li = 0; li < lb.length; li++) lb[li].addEventListener('click', function () { applyLang(this.getAttribute('data-lang')); });

/* --------------------------------- start --------------------------------- */
var startLang = 'en';
try { startLang = localStorage.getItem(LANG_KEY) || 'en'; } catch (e) {}
loadDefaultSheets();
applyLang(startLang);
setStatus('sheetPasteStatus', '', 'preloaded');
setStatus('projStatus', '', 'noProj');
if (!restoreSaved()) { renderStock(); renderReport(); renderLayout(); }
markDirty(false);
setHint(parts.length ? 'hintReady' : 'hintStart', parts.length ? 'warn' : 'idle');
if (parts.length) $('run').classList.add('pending');
window.NESTRI_PRO = { loadSample: loadSample, run: run, state: function () { return { S: S, parts: parts, last: last }; } };
})();
</script>
</body>
</html>
